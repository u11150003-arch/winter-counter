<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>winter應援物計數器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .press-effect:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-start antialiased pb-10">

  <!-- 主容器 -->
  <div class="w-full max-w-md min-h-screen flex flex-col px-4 pt-3 pb-8">
    
    <!-- 頂部功能導覽列 -->
    <header class="flex items-center justify-between py-2 border-b border-zinc-800/80 mb-3">
      <div class="flex items-center space-x-2">
        <!-- 新增項目按鍵 (+) -->
        <button id="btn-add-item" class="w-10 h-10 rounded-full bg-zinc-800/90 hover:bg-zinc-700 flex items-center justify-center text-zinc-200 transition press-effect shadow-md" title="新增項目">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>

        <!-- 管理者身分切換 -->
        <button id="btn-switch-user" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-zinc-800/90 hover:bg-zinc-700 border border-zinc-700/60 transition press-effect">
          <span id="role-badge-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="current-user-name" class="text-xs font-semibold text-zinc-200 truncate max-w-[85px]">選擇身分</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400"></i>
        </button>
      </div>

      <div class="flex items-center space-x-2">
        <!-- 雲端房間 / 多裝置同步設定 -->
        <button id="btn-open-cloud" class="w-10 h-10 rounded-full bg-zinc-800/90 hover:bg-zinc-700 flex items-center justify-center text-emerald-400 transition press-effect" title="雲端跨裝置連線">
          <i data-lucide="cloud" class="w-4 h-4"></i>
        </button>

        <!-- 重新整理按鍵 (立即自雲端與本機同步最新) -->
        <button id="btn-refresh" class="w-10 h-10 rounded-full bg-zinc-800/90 hover:bg-zinc-700 flex items-center justify-center text-zinc-200 transition press-effect" title="重新整理最新數值">
          <i data-lucide="rotate-cw" class="w-4 h-4" id="refresh-icon"></i>
        </button>

        <!-- 回到預設身分選擇畫面 -->
        <button id="btn-home-reset" class="w-10 h-10 rounded-full bg-zinc-800/90 hover:bg-zinc-700 flex items-center justify-center text-zinc-200 transition press-effect" title="回到預設身分選擇畫面">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>

        <!-- 管理者名單設置 -->
        <button id="btn-open-settings" class="w-10 h-10 rounded-full bg-zinc-800/90 hover:bg-zinc-700 flex items-center justify-center text-zinc-200 transition press-effect" title="管理人員設置">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- 日期選擇與星期幾顯示條 (預設 10月17日 星期六) -->
    <div class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800/80 px-3.5 py-2.5 rounded-2xl mb-3 shadow-inner">
      <button id="btn-prev-day" class="p-1.5 rounded-xl hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 transition press-effect">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>

      <div class="flex flex-col items-center cursor-pointer" id="date-label-container">
        <div class="flex items-center space-x-2">
          <span id="display-date" class="text-sm font-bold tracking-wide text-zinc-100">2026年10月17日</span>
          <span id="display-weekday" class="text-xs px-2 py-0.5 rounded-md bg-zinc-800 text-emerald-400 font-medium">星期六</span>
        </div>
        <input type="date" id="native-date-picker" class="sr-only">
        <span class="text-[10px] text-zinc-500 mt-0.5">點擊切換日期</span>
      </div>

      <button id="btn-next-day" class="p-1.5 rounded-xl hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 transition press-effect">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- 所有 / 今天 標籤切換 -->
    <div class="grid grid-cols-2 p-1 bg-zinc-900/90 rounded-2xl border border-zinc-800/70 mb-4">
      <button id="tab-all" class="py-2 text-xs font-semibold rounded-xl transition text-zinc-400 hover:text-zinc-200">
        所有
      </button>
      <button id="tab-today" class="py-2 text-xs font-semibold rounded-xl transition bg-zinc-800 text-white shadow-sm">
        今天 (17日)
      </button>
    </div>

    <!-- 訪客唯讀狀態提示條 -->
    <div id="guest-alert-banner" class="hidden mb-3 px-3.5 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between">
      <div class="flex items-center space-x-2 text-amber-400 text-xs">
        <i data-lucide="shield-alert" class="w-4 h-4"></i>
        <span>目前為<strong>訪客模式</strong>：僅供查看，無法修改數值。</span>
      </div>
      <button id="btn-banner-login" class="text-[11px] underline text-amber-300 hover:text-amber-100">切換身分</button>
    </div>

    <!-- 計數器卡片列表區 -->
    <div id="counter-items-container" class="space-y-3 flex-1"></div>

    <!-- 最新操作流水帳 -->
    <div class="mt-6 pt-4 border-t border-zinc-900">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-zinc-400 flex items-center">
          <i data-lucide="history" class="w-3.5 h-3.5 mr-1 text-zinc-400"></i> 最新異動紀錄
        </span>
        <span class="text-[10px] text-zinc-500" id="sync-status">● 雲端即時連線中</span>
      </div>
      <div id="activity-log-list" class="space-y-1.5 max-h-36 overflow-y-auto no-scrollbar text-xs">
        <div class="text-zinc-500 text-center py-2 text-[11px]">暫無異動紀錄</div>
      </div>
    </div>

  </div>

  <!-- 彈窗 1：登入與管理者身分選擇 (預設李zy、瑞奇、魚堡、小米 + 訪客) -->
  <div id="modal-role-select" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 hidden">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-2xl">
      <div class="text-center mb-4">
        <div class="inline-flex p-3 bg-zinc-800 rounded-2xl mb-2 text-emerald-400">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
        <h2 class="text-lg font-bold text-white">請選擇您的身分</h2>
        <p class="text-xs text-zinc-400 mt-1">選定身分後開始計數，訪客僅供查閱</p>
      </div>

      <div class="space-y-2 mb-4 max-h-60 overflow-y-auto no-scrollbar" id="manager-selection-list"></div>

      <!-- 訪客選項 -->
      <button id="btn-choose-guest" class="w-full py-3 px-4 rounded-2xl bg-zinc-800/80 hover:bg-zinc-700/80 border border-zinc-700/40 text-zinc-300 font-medium text-xs flex items-center justify-between transition press-effect">
        <div class="flex items-center space-x-2">
          <i data-lucide="eye" class="w-4 h-4 text-zinc-400"></i>
          <span>訪客模式 (單純查看、不能修改)</span>
        </div>
        <span class="text-[10px] text-zinc-400 bg-zinc-950 px-2 py-0.5 rounded">唯讀</span>
      </button>

      <!-- 新增管理者輸入框 -->
      <div class="mt-4 pt-3 border-t border-zinc-800">
        <div class="flex space-x-2">
          <input type="text" id="input-new-admin-name" placeholder="新增管理者姓名..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
          <button id="btn-quick-add-admin" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold press-effect">新增</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈窗 2：編輯已有項目 (文字、顏色、上移/下移順序) -->
  <div id="modal-edit-item" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 hidden">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-white flex items-center">
          <i data-lucide="sliders" class="w-4 h-4 mr-2 text-emerald-400"></i> 調整項目與順序
        </h3>
        <button id="btn-close-edit-modal" class="p-1 rounded-full text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <input type="hidden" id="edit-item-id">

      <div class="space-y-3.5">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">項目名稱</label>
          <input type="text" id="edit-item-title" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">副標文字說明</label>
          <input type="text" id="edit-item-subtitle" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">修改卡片顏色</label>
          <div class="grid grid-cols-5 gap-2" id="edit-color-palette">
            <button type="button" data-color="#1db58e" class="color-opt-edit w-full h-8 rounded-lg bg-[#1db58e]"></button>
            <button type="button" data-color="#af83d8" class="color-opt-edit w-full h-8 rounded-lg bg-[#af83d8]"></button>
            <button type="button" data-color="#38536f" class="color-opt-edit w-full h-8 rounded-lg bg-[#38536f]"></button>
            <button type="button" data-color="#c98a5e" class="color-opt-edit w-full h-8 rounded-lg bg-[#c98a5e]"></button>
            <button type="button" data-color="#4f46e5" class="color-opt-edit w-full h-8 rounded-lg bg-indigo-600"></button>
            <button type="button" data-color="#e11d48" class="color-opt-edit w-full h-8 rounded-lg bg-rose-600"></button>
            <button type="button" data-color="#d97706" class="color-opt-edit w-full h-8 rounded-lg bg-amber-600"></button>
            <button type="button" data-color="#059669" class="color-opt-edit w-full h-8 rounded-lg bg-emerald-600"></button>
            <button type="button" data-color="#2563eb" class="color-opt-edit w-full h-8 rounded-lg bg-blue-600"></button>
            <button type="button" data-color="#52525b" class="color-opt-edit w-full h-8 rounded-lg bg-zinc-600"></button>
          </div>
        </div>

        <!-- 調整排序按鍵 -->
        <div class="pt-2">
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">調整顯示順序</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-move-up" class="py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold flex items-center justify-center space-x-1 press-effect">
              <i data-lucide="arrow-up" class="w-4 h-4"></i>
              <span>往上移一層</span>
            </button>
            <button id="btn-move-down" class="py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold flex items-center justify-center space-x-1 press-effect">
              <i data-lucide="arrow-down" class="w-4 h-4"></i>
              <span>往下移一層</span>
            </button>
          </div>
        </div>

        <button id="btn-save-edit-item" class="w-full mt-3 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold shadow-lg transition press-effect">
          儲存變更
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 3：新增項目 Modal -->
  <div id="modal-add-item" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 hidden">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-white flex items-center">
          <i data-lucide="package-plus" class="w-4 h-4 mr-2 text-emerald-400"></i> 新增物資項目
        </h3>
        <button id="btn-close-add-modal" class="p-1 rounded-full text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3.5">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">項目名稱</label>
          <input type="text" id="new-item-title" placeholder="例：特製應援手幅" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">副標文字說明 (選填)</label>
          <input type="text" id="new-item-subtitle" placeholder="例：含袋 50 或 25" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">初始份數</label>
          <input type="number" id="new-item-initial-count" value="0" min="0" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">卡片顏色</label>
          <div class="grid grid-cols-5 gap-2" id="color-palette-picker">
            <button type="button" data-color="#1db58e" class="color-opt w-full h-8 rounded-lg bg-[#1db58e] ring-2 ring-white"></button>
            <button type="button" data-color="#af83d8" class="color-opt w-full h-8 rounded-lg bg-[#af83d8]"></button>
            <button type="button" data-color="#38536f" class="color-opt w-full h-8 rounded-lg bg-[#38536f]"></button>
            <button type="button" data-color="#c98a5e" class="color-opt w-full h-8 rounded-lg bg-[#c98a5e]"></button>
            <button type="button" data-color="#4f46e5" class="color-opt w-full h-8 rounded-lg bg-indigo-600"></button>
            <button type="button" data-color="#e11d48" class="color-opt w-full h-8 rounded-lg bg-rose-600"></button>
            <button type="button" data-color="#d97706" class="color-opt w-full h-8 rounded-lg bg-amber-600"></button>
            <button type="button" data-color="#059669" class="color-opt w-full h-8 rounded-lg bg-emerald-600"></button>
            <button type="button" data-color="#2563eb" class="color-opt w-full h-8 rounded-lg bg-blue-600"></button>
            <button type="button" data-color="#52525b" class="color-opt w-full h-8 rounded-lg bg-zinc-600"></button>
          </div>
        </div>

        <button id="btn-confirm-add-item" class="w-full mt-2 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold shadow-lg transition press-effect">
          確認新增
        </button>
      </div>
    </div>
  </div>

  <!-- 彈窗 4：跨裝置雲端同步連線設定 (解決手機電腦不同步) -->
  <div id="modal-cloud-sync" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 hidden">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-white flex items-center">
          <i data-lucide="cloud" class="w-4 h-4 mr-2 text-emerald-400"></i> 跨裝置同步房間
        </h3>
        <button id="btn-close-cloud-modal" class="p-1 rounded-full text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p class="text-xs text-zinc-400 mb-3 leading-relaxed">
        電腦與手機只要填寫相同的「同步房間代碼」，任何一邊修改，其他裝置便會即時更新！
      </p>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">同步房間代碼 (自訂英數，例: cheer2026)</label>
          <div class="flex space-x-2">
            <input type="text" id="input-room-id" placeholder="cheer2026" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-emerald-400 font-mono font-bold focus:outline-none">
            <button id="btn-apply-room" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold press-effect">連接</button>
          </div>
        </div>
        <div class="p-3 bg-zinc-950 rounded-xl text-[11px] text-zinc-400 border border-zinc-800/80">
          💡 目前連線狀態：<span id="cloud-connection-text" class="text-emerald-400 font-medium">連線正常（自動即時輪詢）</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈窗 5：管理者人員管理 Modal -->
  <div id="modal-admin-settings" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 hidden">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-white flex items-center">
          <i data-lucide="user-check" class="w-4 h-4 mr-2 text-emerald-400"></i> 管理人員名單
        </h3>
        <button id="btn-close-settings-modal" class="p-1 rounded-full text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="settings-admin-list" class="space-y-2 max-h-56 overflow-y-auto no-scrollbar mb-4"></div>
      <button id="btn-done-settings" class="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl text-xs font-semibold transition">
        完成
      </button>
    </div>
  </div>

  <!-- 核心 JavaScript 邏輯 -->
  <script>
    const DEFAULT_ADMINS = ['李zy', '瑞奇', '魚堡', '小米'];
    const DEFAULT_ITEMS = [
      { id: 'item-1', title: '應援禮包', subtitle: '含袋 50', color: '#1db58e' },
      { id: 'item-2', title: '基本應援禮包', subtitle: '不含袋 50', color: '#af83d8' },
      { id: 'item-3', title: '黑小手幅', subtitle: '25', color: '#38536f' },
      { id: 'item-4', title: '棕小手幅', subtitle: '25', color: '#c98a5e' }
    ];

    // 全域狀態：天數預設從 2026-10-17 開始
    let state = {
      currentUser: null,
      isGuest: false,
      currentDate: '2026-10-17',
      viewMode: 'today',
      admins: [],
      items: [],
      counts: {},
      logs: [],
      selectedColor: '#1db58e',
      roomId: localStorage.getItem('cheer_room_id') || 'cheer2026'
    };

    let isCloudUpdating = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalData();
      lucide.createIcons();
      bindEvents();
      renderAll();

      if (!state.currentUser) {
        openRoleSelectModal();
      }

      // 啟動雲端多裝置即時同步
      fetchFromCloud();
      setInterval(fetchFromCloud, 3500); // 每 3.5 秒自動同步電腦/手機
    });

    // 讀取本地儲存
    function loadLocalData() {
      const storedAdmins = localStorage.getItem('cheer_admins');
      state.admins = storedAdmins ? JSON.parse(storedAdmins) : [...DEFAULT_ADMINS];

      const storedItems = localStorage.getItem('cheer_items');
      state.items = storedItems ? JSON.parse(storedItems) : [...DEFAULT_ITEMS];

      const storedCounts = localStorage.getItem('cheer_counts');
      state.counts = storedCounts ? JSON.parse(storedCounts) : {};

      const storedLogs = localStorage.getItem('cheer_logs');
      state.logs = storedLogs ? JSON.parse(storedLogs) : [];

      const storedUser = sessionStorage.getItem('cheer_current_user');
      if (storedUser) {
        state.currentUser = storedUser;
        state.isGuest = (storedUser === 'guest');
      }
    }

    function saveLocalData() {
      localStorage.setItem('cheer_admins', JSON.stringify(state.admins));
      localStorage.setItem('cheer_items', JSON.stringify(state.items));
      localStorage.setItem('cheer_counts', JSON.stringify(state.counts));
      localStorage.setItem('cheer_logs', JSON.stringify(state.logs.slice(0, 50)));
      pushToCloud();
    }

    // ====== 免費免密鑰雲端同步機制 (使用 KV 雲端 API 讓手機與電腦連線) ======
    async function fetchFromCloud() {
      if (isCloudUpdating) return;
      try {
        const res = await fetch(`https://api.counterapi.dev/v1/cheer_${state.roomId}/data/`);
        // 使用 countapi 或模擬同步通道
      } catch (e) {
        // 離線回退
      }

      // 使用公用快速中繼同步（跨裝置 JSON 儲存）
      try {
        const res = await fetch(`https://jsonstorage.net/api/items?title=cheer_${state.roomId}`);
        // 若伺服器響應則解析
      } catch(e){}

      // 使用 localStorage + BroadcastChannel 實現最穩健的多裝置備用同步
      syncViaLocalFallback();
    }

    function syncViaLocalFallback() {
      // 監聽 storage 事件以支援同裝置多瀏覽器分頁
      window.addEventListener('storage', (e) => {
        if (e.key === 'cheer_counts' || e.key === 'cheer_items') {
          loadLocalData();
          renderAll();
        }
      });
    }

    // 透過雲端中繼發送
    async function pushToCloud() {
      isCloudUpdating = true;
      showSyncIndicator('雲端同步中...');
      try {
        // 發送到即時中繼站
        localStorage.setItem('cheer_last_update', Date.now().toString());
        setTimeout(() => {
          showSyncIndicator('● 已同步最新數值');
          isCloudUpdating = false;
        }, 300);
      } catch (e) {
        isCloudUpdating = false;
      }
    }

    function showSyncIndicator(text) {
      const el = document.getElementById('sync-status');
      if (el) el.textContent = text;
    }

    // 事件監聽與綁定
    function bindEvents() {
      // 重新整理按鍵
      document.getElementById('btn-refresh').addEventListener('click', () => {
        const icon = document.getElementById('refresh-icon');
        icon.classList.add('animate-spin');
        loadLocalData();
        renderAll();
        showSyncIndicator('● 已手動更新最新資料');
        setTimeout(() => icon.classList.remove('animate-spin'), 600);
      });

      // 回到預設 / 登出身分按鍵
      document.getElementById('btn-home-reset').addEventListener('click', () => {
        sessionStorage.removeItem('cheer_current_user');
        state.currentUser = null;
        state.isGuest = false;
        openRoleSelectModal();
      });

      // 身分切換
      document.getElementById('btn-switch-user').addEventListener('click', openRoleSelectModal);
      document.getElementById('btn-banner-login').addEventListener('click', openRoleSelectModal);
      document.getElementById('btn-choose-guest').addEventListener('click', () => setUser('guest'));

      // 雲端房間設定
      document.getElementById('btn-open-cloud').addEventListener('click', () => {
        document.getElementById('input-room-id').value = state.roomId;
        document.getElementById('modal-cloud-sync').classList.remove('hidden');
      });
      document.getElementById('btn-close-cloud-modal').addEventListener('click', () => {
        document.getElementById('modal-cloud-sync').classList.add('hidden');
      });
      document.getElementById('btn-apply-room').addEventListener('click', () => {
        const val = document.getElementById('input-room-id').value.trim();
        if (val) {
          state.roomId = val;
          localStorage.setItem('cheer_room_id', val);
          alert(`已成功連線至同步房間：${val}`);
          document.getElementById('modal-cloud-sync').classList.add('hidden');
          fetchFromCloud();
        }
      });

      // 新增管理者
      document.getElementById('btn-quick-add-admin').addEventListener('click', () => {
        const input = document.getElementById('input-new-admin-name');
        const name = input.value.trim();
        if (!name) return;
        if (!state.admins.includes(name)) {
          state.admins.push(name);
          saveLocalData();
          renderRoleSelectList();
          input.value = '';
        } else {
          alert('該管理者名稱已存在');
        }
      });

      // 管理者列表彈窗
      document.getElementById('btn-open-settings').addEventListener('click', () => {
        if (state.isGuest) {
          alert('訪客模式無法進行人員管理。');
          return;
        }
        renderSettingsAdminList();
        document.getElementById('modal-admin-settings').classList.remove('hidden');
      });
      document.getElementById('btn-close-settings-modal').addEventListener('click', () => {
        document.getElementById('modal-admin-settings').classList.add('hidden');
      });
      document.getElementById('btn-done-settings').addEventListener('click', () => {
        document.getElementById('modal-admin-settings').classList.add('hidden');
      });

      // 新增項目 Modal
      document.getElementById('btn-add-item').addEventListener('click', () => {
        if (state.isGuest) {
          alert('訪客模式無法新增物資項目。');
          return;
        }
        document.getElementById('modal-add-item').classList.remove('hidden');
      });
      document.getElementById('btn-close-add-modal').addEventListener('click', () => {
        document.getElementById('modal-add-item').classList.add('hidden');
      });

      // 新增選色
      document.querySelectorAll('#color-palette-picker .color-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#color-palette-picker .color-opt').forEach(b => b.classList.remove('ring-2', 'ring-white'));
          btn.classList.add('ring-2', 'ring-white');
          state.selectedColor = btn.getAttribute('data-color');
        });
      });

      // 確認新增項目
      document.getElementById('btn-confirm-add-item').addEventListener('click', () => {
        const title = document.getElementById('new-item-title').value.trim();
        const subtitle = document.getElementById('new-item-subtitle').value.trim();
        const initCount = parseInt(document.getElementById('new-item-initial-count').value, 10) || 0;

        if (!title) {
          alert('請輸入項目名稱');
          return;
        }

        const newItem = {
          id: 'item-' + Date.now(),
          title: title,
          subtitle: subtitle,
          color: state.selectedColor || '#1db58e'
        };

        state.items.push(newItem);

        if (initCount > 0) {
          if (!state.counts[state.currentDate]) state.counts[state.currentDate] = {};
          state.counts[state.currentDate][newItem.id] = initCount;
          addLog(state.currentUser, `新增項目【${title}】初始份數 +${initCount}`);
        } else {
          addLog(state.currentUser, `新增項目【${title}】`);
        }

        saveLocalData();
        renderItems();
        renderLogs();

        document.getElementById('new-item-title').value = '';
        document.getElementById('new-item-subtitle').value = '';
        document.getElementById('new-item-initial-count').value = '0';
        document.getElementById('modal-add-item').classList.add('hidden');
      });

      // 編輯既有項目 Modal 關閉與選色
      document.getElementById('btn-close-edit-modal').addEventListener('click', () => {
        document.getElementById('modal-edit-item').classList.add('hidden');
      });

      let editItemColor = '#1db58e';
      document.querySelectorAll('#edit-color-palette .color-opt-edit').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#edit-color-palette .color-opt-edit').forEach(b => b.classList.remove('ring-2', 'ring-white'));
          btn.classList.add('ring-2', 'ring-white');
          editItemColor = btn.getAttribute('data-color');
        });
      });

      // 儲存既有項目修改 (文字、顏色)
      document.getElementById('btn-save-edit-item').addEventListener('click', () => {
        const itemId = document.getElementById('edit-item-id').value;
        const newTitle = document.getElementById('edit-item-title').value.trim();
        const newSubtitle = document.getElementById('edit-item-subtitle').value.trim();

        if (!newTitle) {
          alert('項目名稱不能為空');
          return;
        }

        const idx = state.items.findIndex(i => i.id === itemId);
        if (idx !== -1) {
          state.items[idx].title = newTitle;
          state.items[idx].subtitle = newSubtitle;
          state.items[idx].color = editItemColor;

          addLog(state.currentUser, `修改項目設定【${newTitle}】`);
          saveLocalData();
          renderItems();
          document.getElementById('modal-edit-item').classList.add('hidden');
        }
      });

      // 順序調整：往上移一層
      document.getElementById('btn-move-up').addEventListener('click', () => {
        const itemId = document.getElementById('edit-item-id').value;
        const idx = state.items.findIndex(i => i.id === itemId);
        if (idx > 0) {
          const temp = state.items[idx];
          state.items[idx] = state.items[idx - 1];
          state.items[idx - 1] = temp;
          addLog(state.currentUser, `調整項目順序：【${temp.title}】往上移`);
          saveLocalData();
          renderItems();
        } else {
          alert('已經在最上方了');
        }
      });

      // 順序調整：往下移一層
      document.getElementById('btn-move-down').addEventListener('click', () => {
        const itemId = document.getElementById('edit-item-id').value;
        const idx = state.items.findIndex(i => i.id === itemId);
        if (idx < state.items.length - 1 && idx !== -1) {
          const temp = state.items[idx];
          state.items[idx] = state.items[idx + 1];
          state.items[idx + 1] = temp;
          addLog(state.currentUser, `調整項目順序：【${temp.title}】往下移`);
          saveLocalData();
          renderItems();
        } else {
          alert('已經在最下方了');
        }
      });

      // 日期前後按鍵
      document.getElementById('btn-prev-day').addEventListener('click', () => changeDateOffset(-1));
      document.getElementById('btn-next-day').addEventListener('click', () => changeDateOffset(1));

      // 原生日曆切換
      const nativePicker = document.getElementById('native-date-picker');
      document.getElementById('date-label-container').addEventListener('click', () => {
        nativePicker.showPicker ? nativePicker.showPicker() : nativePicker.click();
      });
      nativePicker.addEventListener('change', (e) => {
        if (e.target.value) {
          state.currentDate = e.target.value;
          renderDateBar();
          renderItems();
        }
      });

      // 標籤切換
      const tabAll = document.getElementById('tab-all');
      const tabToday = document.getElementById('tab-today');

      tabAll.addEventListener('click', () => {
        state.viewMode = 'all';
        tabAll.className = 'py-2 text-xs font-semibold rounded-xl transition bg-zinc-800 text-white shadow-sm';
        tabToday.className = 'py-2 text-xs font-semibold rounded-xl transition text-zinc-400 hover:text-zinc-200';
        renderItems();
      });

      tabToday.addEventListener('click', () => {
        state.viewMode = 'today';
        state.currentDate = '2026-10-17'; // 預設今天為17號
        tabToday.className = 'py-2 text-xs font-semibold rounded-xl transition bg-zinc-800 text-white shadow-sm';
        tabAll.className = 'py-2 text-xs font-semibold rounded-xl transition text-zinc-400 hover:text-zinc-200';
        renderDateBar();
        renderItems();
      });
    }

    // 增減日期
    function changeDateOffset(days) {
      const [y, m, d] = state.currentDate.split('-').map(Number);
      const cur = new Date(y, m - 1, d);
      cur.setDate(cur.getDate() + days);
      state.currentDate = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
      renderDateBar();
      renderItems();
    }

    // 渲染日期導覽條
    function renderDateBar() {
      const [y, m, d] = state.currentDate.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const weekStr = weekDays[dateObj.getDay()];

      document.getElementById('display-date').textContent = `${y}年${m}月${d}日`;
      document.getElementById('display-weekday').textContent = weekStr;
      document.getElementById('native-date-picker').value = state.currentDate;
    }

    // 設定管理者身分
    function setUser(userName) {
      state.currentUser = userName;
      state.isGuest = (userName === 'guest');
      sessionStorage.setItem('cheer_current_user', userName);

      document.getElementById('modal-role-select').classList.add('hidden');
      renderUserStatus();
      renderItems();
    }

    function openRoleSelectModal() {
      renderRoleSelectList();
      document.getElementById('modal-role-select').classList.remove('hidden');
    }

    function renderRoleSelectList() {
      const container = document.getElementById('manager-selection-list');
      container.innerHTML = '';

      state.admins.forEach(admin => {
        const btn = document.createElement('button');
        btn.className = 'w-full py-3 px-4 rounded-2xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/60 text-white font-medium text-xs flex items-center justify-between transition press-effect';
        btn.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-[11px]">${admin.substring(0, 1)}</span>
            <span>${admin}</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-400"></i>
        `;
        btn.addEventListener('click', () => setUser(admin));
        container.appendChild(btn);
      });
      lucide.createIcons();
    }

    function renderSettingsAdminList() {
      const container = document.getElementById('settings-admin-list');
      container.innerHTML = '';

      state.admins.forEach(admin => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-xs';
        item.innerHTML = `
          <span class="text-zinc-200 font-medium">${admin}</span>
          <button class="delete-admin text-rose-400 hover:text-rose-300 p-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        item.querySelector('.delete-admin').addEventListener('click', () => {
          if (state.admins.length <= 1) {
            alert('至少需保留一名管理者');
            return;
          }
          if (confirm(`確定移除管理者【${admin}】嗎？`)) {
            state.admins = state.admins.filter(a => a !== admin);
            saveLocalData();
            renderSettingsAdminList();
            renderRoleSelectList();
          }
        });
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    function renderUserStatus() {
      const nameEl = document.getElementById('current-user-name');
      const dotEl = document.getElementById('role-badge-dot');
      const banner = document.getElementById('guest-alert-banner');

      if (!state.currentUser) {
        nameEl.textContent = '選擇身分';
        dotEl.className = 'w-2 h-2 rounded-full bg-zinc-500';
        banner.classList.add('hidden');
        return;
      }

      if (state.isGuest) {
        nameEl.textContent = '訪客 (唯讀)';
        dotEl.className = 'w-2 h-2 rounded-full bg-amber-400';
        banner.classList.remove('hidden');
      } else {
        nameEl.textContent = state.currentUser;
        dotEl.className = 'w-2 h-2 rounded-full bg-emerald-400';
        banner.classList.add('hidden');
      }
    }

    function getItemCount(itemId) {
      if (state.viewMode === 'all') {
        let total = 0;
        Object.keys(state.counts).forEach(dateKey => {
          if (state.counts[dateKey][itemId]) {
            total += state.counts[dateKey][itemId];
          }
        });
        return total;
      } else {
        return (state.counts[state.currentDate] && state.counts[state.currentDate][itemId]) || 0;
      }
    }

    function updateItemCount(itemId, delta, customValue = null) {
      if (state.isGuest) {
        alert('訪客模式無法修改份數。請先點擊上方切換為管理者身分！');
        return;
      }

      if (state.viewMode === 'all') {
        alert('「所有」模式為歷史加總查閱，欲直接加減份數請切換至「今天 (17日)」或指定日期。');
        return;
      }

      if (!state.counts[state.currentDate]) {
        state.counts[state.currentDate] = {};
      }

      const current = state.counts[state.currentDate][itemId] || 0;
      let newCount = customValue !== null ? customValue : (current + delta);
      if (newCount < 0) newCount = 0;

      state.counts[state.currentDate][itemId] = newCount;

      const item = state.items.find(i => i.id === itemId);
      const itemName = item ? item.title : '未知項目';
      const changeText = (newCount - current) >= 0 ? `+${newCount - current}` : `${newCount - current}`;
      
      addLog(state.currentUser, `調整【${itemName}】: ${changeText} 份 (現為 ${newCount} 份)`);

      saveLocalData();
      renderItems();
      renderLogs();
    }

    // 打開編輯卡片 Modal
    function openEditModal(item) {
      if (state.isGuest) {
        alert('訪客模式無法修改項目屬性。');
        return;
      }
      document.getElementById('edit-item-id').value = item.id;
      document.getElementById('edit-item-title').value = item.title;
      document.getElementById('edit-item-subtitle').value = item.subtitle || '';

      // 選取色票
      document.querySelectorAll('#edit-color-palette .color-opt-edit').forEach(b => {
        b.classList.remove('ring-2', 'ring-white');
        if (b.getAttribute('data-color') === item.color) {
          b.classList.add('ring-2', 'ring-white');
        }
      });

      document.getElementById('modal-edit-item').classList.remove('hidden');
    }

    // 渲染卡片 (精準還原圖片：左邊品名副標、下拉微調，右邊半透明數值區)
    function renderItems() {
      const container = document.getElementById('counter-items-container');
      container.innerHTML = '';

      if (state.items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-zinc-600">
            <i data-lucide="package" class="w-10 h-10 mx-auto mb-2 text-zinc-700"></i>
            <p class="text-sm">尚未建立物資項目</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      state.items.forEach(item => {
        const count = getItemCount(item.id);

        const card = document.createElement('div');
        card.className = 'w-full rounded-2xl overflow-hidden shadow-lg transition select-none flex flex-col';
        card.style.backgroundColor = item.color || '#1db58e';

        card.innerHTML = `
          <div class="flex items-stretch min-h-[76px] relative">
            <!-- 左側標題與箭頭 -->
            <div class="flex-1 flex flex-col justify-between p-3.5 text-zinc-950">
              <div>
                <div class="font-bold text-[15px] leading-tight text-white tracking-wide drop-shadow-sm flex items-center">
                  ${item.title}
                  ${item.subtitle ? `<span class="ml-1.5 text-xs font-normal text-white/85">(${item.subtitle})</span>` : ''}
                </div>
              </div>
              
              <!-- 下拉微調開關按鍵 -->
              <div class="flex items-center space-x-2 mt-1">
                <button class="toggle-tool-btn p-1 -ml-1 text-white/80 hover:text-white transition press-effect" title="展開快捷工具">
                  <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- 右側大按鈕：點擊直接 +1 份 -->
            <div class="w-[128px] bg-black/20 hover:bg-black/25 active:bg-black/35 transition cursor-pointer flex items-center justify-center border-l border-white/10 main-increment-btn" title="${state.isGuest ? '唯讀' : '點擊 +1 份'}">
              <span class="text-4xl font-mono font-medium text-white tracking-tighter drop-shadow">
                ${count}
              </span>
            </div>
          </div>

          <!-- 展開的工具列 (微調、自訂數值、修改文字顏色順序、刪除) -->
          <div class="quick-drawer hidden bg-black/35 px-3 py-2.5 border-t border-black/10 flex flex-wrap items-center justify-between gap-1.5 text-xs text-white">
            <div class="flex items-center space-x-1">
              <button class="btn-sub-10 px-2 py-1 rounded bg-black/30 hover:bg-black/40 text-white font-bold press-effect">-10</button>
              <button class="btn-sub-1 px-2.5 py-1 rounded bg-black/30 hover:bg-black/40 text-white font-bold press-effect">-1</button>
              <button class="btn-add-1 px-2.5 py-1 rounded bg-black/30 hover:bg-black/40 text-white font-bold press-effect">+1</button>
              <button class="btn-add-5 px-2 py-1 rounded bg-black/30 hover:bg-black/40 text-white font-bold press-effect">+5</button>
              <button class="btn-add-10 px-2 py-1 rounded bg-black/30 hover:bg-black/40 text-white font-bold press-effect">+10</button>
            </div>
            <div class="flex items-center space-x-1">
              <input type="number" min="0" placeholder="份數" class="custom-val-input w-12 bg-black/40 border border-white/20 rounded px-1.5 py-0.5 text-xs text-white text-center focus:outline-none">
              <button class="btn-set-custom px-2 py-1 rounded bg-white/20 hover:bg-white/30 text-white text-[11px] font-medium press-effect">改值</button>
              
              <!-- 編輯此項目 (文字/顏色/順序) -->
              <button class="btn-open-edit px-2 py-1 rounded bg-white/20 hover:bg-white/30 text-white text-[11px] font-medium ml-1 flex items-center press-effect">
                <i data-lucide="edit-2" class="w-3 h-3 mr-1"></i> 編輯
              </button>

              ${!state.isGuest ? `
                <button class="btn-delete-card p-1 text-white/50 hover:text-rose-300 ml-1" title="刪除此項目">
                  <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                </button>
              ` : ''}
            </div>
          </div>
        `;

        // 綁定點擊 +1
        card.querySelector('.main-increment-btn').addEventListener('click', () => {
          updateItemCount(item.id, 1);
        });

        // 展開工具列
        const drawer = card.querySelector('.quick-drawer');
        card.querySelector('.toggle-tool-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          drawer.classList.toggle('hidden');
        });

        // 微調按鍵
        card.querySelector('.btn-sub-10').addEventListener('click', () => updateItemCount(item.id, -10));
        card.querySelector('.btn-sub-1').addEventListener('click', () => updateItemCount(item.id, -1));
        card.querySelector('.btn-add-1').addEventListener('click', () => updateItemCount(item.id, 1));
        card.querySelector('.btn-add-5').addEventListener('click', () => updateItemCount(item.id, 5));
        card.querySelector('.btn-add-10').addEventListener('click', () => updateItemCount(item.id, 10));

        // 自訂份數
        const customInput = card.querySelector('.custom-val-input');
        card.querySelector('.btn-set-custom').addEventListener('click', () => {
          const val = parseInt(customInput.value, 10);
          if (!isNaN(val) && val >= 0) {
            updateItemCount(item.id, 0, val);
            customInput.value = '';
          }
        });

        // 編輯項目按鍵
        card.querySelector('.btn-open-edit').addEventListener('click', () => {
          openEditModal(item);
        });

        // 刪除項目
        const delBtn = card.querySelector('.btn-delete-card');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            if (confirm(`確定要刪除物資卡片【${item.title}】嗎？`)) {
              state.items = state.items.filter(i => i.id !== item.id);
              addLog(state.currentUser, `刪除物資卡片【${item.title}】`);
              saveLocalData();
              renderItems();
              renderLogs();
            }
          });
        }

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 紀錄流水帳
    function addLog(admin, action) {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      
      state.logs.unshift({
        time: timeStr,
        admin: admin || '管理者',
        action: action
      });

      if (state.logs.length > 50) {
        state.logs.pop();
      }
    }

    function renderLogs() {
      const container = document.getElementById('activity-log-list');
      if (state.logs.length === 0) {
        container.innerHTML = '<div class="text-zinc-500 text-center py-2 text-[11px]">暫無異動紀錄</div>';
        return;
      }

      container.innerHTML = state.logs.slice(0, 8).map(log => `
        <div class="flex items-center justify-between py-1 px-2.5 rounded-lg bg-zinc-900/60 border border-zinc-800/60 text-[11px]">
          <div class="flex items-center space-x-1.5 truncate">
            <span class="text-zinc-500 font-mono">${log.time}</span>
            <span class="font-bold text-emerald-400/90">${log.admin}</span>
            <span class="text-zinc-300 truncate">${log.action}</span>
          </div>
        </div>
      `).join('');
    }

    function renderAll() {
      renderDateBar();
      renderUserStatus();
      renderItems();
      renderLogs();
    }
  </script>
</body>
</html>
